name: Lite Thinking QA TestOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-automation-suite:
    name: Ejecución de Pruebas y Reporte
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Levantar Infraestructura de Kafka (Docker)
        run: |
          docker compose -f Semana_3/dia-4-kafka-docker/docker-compose.yml up -d
          echo "Esperando que Kafka-Broker esté completamente inicializado..."
          sleep 15

      - name: 4. Instalar Dependencias de la Aplicación
        run: |
          cd Semana_3/dia-4-kafka-docker/app
          npm install

      - name: 5. Instalar Dependencias de Pruebas (Playwright)
        run: |
          cd Semana_3/dia-4-kafka-docker/tests
          npm install
          npx playwright install --with-deps

      - name: 6. Lanzar Aplicación y Consumidor en Segundo Plano
        run: |
          cd Semana_3/dia-4-kafka-docker/app
          node server.js &
          node worker.js &
          sleep 5

      - name: 7. Ejecutar Pruebas y Transmitir Resultados a Allure TestOps
        run: |
          cd Semana_3/dia-4-kafka-docker/tests
          # La herramienta 'allurectl watch' intercepta la consola y envía reportes en tiempo real
          npx playwright test

  pepe-job:
    name: Job de Prueba Adicional
    runs-on: ubuntu-latest

    steps:
      - name: Paso de Ejemplo
        run: echo "Este es un job adicional para demostrar múltiples jobs en el pipeline"